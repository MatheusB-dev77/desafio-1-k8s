apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hgdcghsvf/desafio-1-api:1.0
          ports:
            - containerPort: 3000
          envFrom:                      # injeta TODAS as chaves como variáveis de ambiente
            - configMapRef:
                name: api-config        # PORT, DB_HOST, DB_PORT, DB_NAME
            - secretRef:
                name: db-credentials    # DB_USER, DB_PASSWORD
          resources:
            requests:                   # o HPA (seção 5) calcula a % de CPU em cima disto
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:               # só entra no Service quando /health responder
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:                # se travar, o K8s reinicia o container
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 80            # porta do Service dentro do cluster
      targetPort: 3000    # porta do container
      nodePort: 30080     # porta exposta no node (faixa 30000-32767)
